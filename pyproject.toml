[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libdqp"
version = "0.1.2"
description = "Differentiation Through Black-Box Quadratic Programming Solvers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Connor W. Magoon"},
    {name = "Fengyu Yang"},
    {name = "Noam Aigerman"},
    {name = "Shahar Z. Kovalsky"},
]
keywords = ["quadratic programming", "differentiation", "optimization", "pytorch", "machine learning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


dependencies = [
    "torch>=2.0.0",
    "numpy",
    "scipy",

    # QP solver wrapper
    "qpsolvers", 

    # some QP solvers which are easily pip installed; details for others at qpsolvers repo
    "clarabel",
    "cvxopt",
    "daqp",
    "ecos",
    "gurobipy",
    "highspy",
    "mosek",
    "osqp",
    "piqp",
    "proxsuite",
    "qpalm",
    "quadprog",
    "scs",

    # linear solvers:
    "pypardiso; sys_platform != 'darwin'", # pypardiso requires mkl which is not supported on macOS
    "qdldl",

       # for our optional naive CPU parallelism
    "joblib", 

    # used in qp_diagnostic.py
    "matplotlib",
    "pandas", 
]

[project.urls]
"Homepage" = "https://github.com/cwmagoon/dQP"
"Paper" = "https://arxiv.org/pdf/2410.06324"

[tool.setuptools.packages.find]
where = ["."]
include = ["dqp*"]

[tool.setuptools.package-data]
"*" = ["*.npz", "*.txt"]
